<style>
/* Layout: barra com idioma e moeda; hero dividido (promessa + celular com demo); seções em coluna de 1080px; calculadora e formulário em duas colunas */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --ink:#122a24; --muted:#56706a; --line:#d7e2de;
  --accent:#0d7a55; --accent-ink:#ffffff; --warm:#b86a12; --soft:#e4efe9;
  --chat-bg:#e7efe9; --bubble-in:#ffffff; --bubble-out:#d6f2e2;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1714; --surface:#14221e; --ink:#e3eeea; --muted:#94aca5; --line:#26382f;
  --accent:#3cc48f; --accent-ink:#06140f; --warm:#e8a24f; --soft:#18302a;
  --chat-bg:#0f1c18; --bubble-in:#1c2d27; --bubble-out:#1d4a37; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1714; --surface:#14221e; --ink:#e3eeea; --muted:#94aca5; --line:#26382f;
  --accent:#3cc48f; --accent-ink:#06140f; --warm:#e8a24f; --soft:#18302a;
  --chat-bg:#0f1c18; --bubble-in:#1c2d27; --bubble-out:#1d4a37; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(2.1rem,5vw,3.4rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:clamp(1.6rem,3.4vw,2.2rem);font-weight:700;letter-spacing:-.01em}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-ink);font-weight:600;border:0;border-radius:999px;padding:13px 22px;font-size:1rem;cursor:pointer;text-decoration:none;font-family:var(--body)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn[aria-disabled="true"]{opacity:.5;pointer-events:none}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--warm);outline-offset:2px}

header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-block:16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid transparent}
.logo{font-family:var(--display);font-weight:800;font-size:1.2rem}
.logo span{color:var(--accent)}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--muted);font:600 .78rem var(--mono);padding:6px 10px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;padding-block:32px 64px}
.hero > div{min-width:0}
.hero p.lead{font-size:1.15rem;color:var(--muted);margin-top:18px;max-width:36ch}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.compare{display:flex;gap:28px;margin-top:36px;flex-wrap:wrap}
.compare div{display:flex;flex-direction:column}
.compare b{font-family:var(--mono);font-size:1.5rem}
.compare .slow b{color:var(--warm)} .compare .fast b{color:var(--accent)}
.compare small{color:var(--muted);font-size:.85rem}
.where{margin-top:28px;font-size:.9rem;color:var(--muted)}
.where b{color:var(--ink);font-weight:600}

.phone{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:10px;box-shadow:0 24px 60px -30px rgba(10,40,30,.45);max-width:390px;width:100%;justify-self:center}
.tabs{display:flex;gap:6px;padding:6px;overflow-x:auto}
.tab{flex:1;white-space:nowrap;border:0;background:transparent;color:var(--muted);font:600 .82rem var(--body);padding:8px 10px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.chat-head{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-family:var(--display)}
.chat-head strong{display:block;font-size:.95rem}
.chat-head small{color:var(--accent);font-size:.78rem}
.chat{background:var(--chat-bg);border-radius:18px;height:360px;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:84%;padding:8px 11px 17px;border-radius:12px;font-size:.9rem;position:relative;line-height:1.4;white-space:pre-line}
.msg.in{align-self:flex-start;background:var(--bubble-out);border-top-left-radius:4px}
.msg.out{align-self:flex-end;background:var(--bubble-in);border-top-right-radius:4px}
.msg time{position:absolute;right:9px;bottom:3px;font-size:.66rem;color:var(--muted);font-family:var(--mono)}
.msg .bot{display:block;font-size:.68rem;font-weight:600;color:var(--accent);margin-bottom:2px}
.typing{align-self:flex-start;background:var(--bubble-out);padding:10px 14px;border-radius:12px;display:flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3}30%{opacity:1}}
@media (prefers-reduced-motion:reduce){.typing i{animation:none}}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 4px 4px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 11px;font:500 .8rem var(--body);cursor:pointer}
.chip:hover{border-color:var(--accent)}
.demo-note{font-size:.75rem;color:var(--muted);text-align:center;padding:6px 0 2px}

section{padding-block:64px;border-top:1px solid var(--line)}
.sec-head{display:flex;flex-direction:column;gap:10px;margin-bottom:32px;max-width:680px}
.sec-head p{color:var(--muted)}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.step{display:flex;flex-direction:column;gap:8px}
.step .n{font-family:var(--mono);font-size:.75rem;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.step p{color:var(--muted)}

.niches{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.niche{background:var(--surface);padding:24px;display:flex;flex-direction:column;gap:8px}
.niche .pain{color:var(--muted);font-size:.95rem}
.niche .gain{font-weight:600;color:var(--accent)}

.calc{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}
.calc > div{min-width:0}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.field label{font-weight:600;font-size:.93rem;display:flex;justify-content:space-between;gap:8px}
.field label output{font-family:var(--mono);color:var(--accent);font-variant-numeric:tabular-nums}
input[type=range]{accent-color:var(--accent);width:100%}
input[type=number],input[type=text],input[type=tel],select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:1rem var(--body)}
.result{background:var(--soft);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:10px}
.result .big{font-family:var(--display);font-weight:800;font-size:clamp(2rem,5vw,3rem);color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.result small{color:var(--muted)}

.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:stretch}
.plan{border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.plan.best{border:2px solid var(--accent)}
.plan .tag{font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);min-height:1.1em}
.price{font-family:var(--display);font-size:1.75rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.price span{white-space:nowrap}
.price small{font-family:var(--body);font-size:.9rem;font-weight:500;color:var(--muted)}
.setup{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.plan ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.93rem;flex:1}
.trial{margin-top:24px;padding:18px 22px;border-radius:14px;background:var(--surface);border:1px dashed var(--accent);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
.trial p{color:var(--muted)}

.faq{max-width:760px}
details{border-bottom:1px solid var(--line);padding-block:16px}
summary{cursor:pointer;font-weight:600;font-size:1.02rem}
details p{margin-top:8px;color:var(--muted)}

.form{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.form .full{grid-column:1/-1}
.form .field{margin:0}
.contact{display:grid;grid-template-columns:.9fr 1.1fr;gap:40px;align-items:start}
.contact > div{min-width:0}
.number{font-family:var(--mono);font-size:1.15rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;user-select:all;display:inline-block;margin-top:16px}
.hint{font-size:.85rem;color:var(--muted);margin-top:10px}
footer{padding-block:32px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line)}

@media (max-width:860px){
  .hero,.calc,.contact{grid-template-columns:1fr;gap:32px}
  .steps,.plans,.niches{grid-template-columns:1fr}
}
@media (max-width:520px){ .form{grid-template-columns:1fr} header.top{position:static} }
</style>
</head>

  <section>

  <section>

  <section id="calculadora">

    <div class="calc">
      <div>
        <div class="field"><label for="cMsgs"><span data-t="cMsgs"></span><output id="oMsgs"></output></label><input type="range" id="cMsgs" min="5" max="200" step="5" value="30"></div>
        <div class="field"><label for="cPct"><span data-t="cPct"></span><output id="oPct"></output></label><input type="range" id="cPct" min="5" max="80" step="5" value="25"></div>
        <div class="field"><label for="cConv"><span data-t="cConv"></span><output id="oConv"></output></label><input type="range" id="cConv" min="1" max="6" step="1" value="2"></div>
        <div class="field"><label for="cTicket"><span data-t="cTicket"></span><span class="cur-code" id="tCur"></span></label><input type="number" id="cTicket" min="1" step="1" inputmode="decimal"></div>
      </div>
      <div class="result">
        <small data-t="cRes"></small>
        <div class="big" id="cOut"></div>
        <p id="cCompare"></p>
        <small data-t="cNote"></small>
      </div>
    </div>
  </section>

  <section id="planos">
    <div class="sec-head"><p class="eyebrow" data-t="planE"></p><h2 data-t="planH"></h2><p data-t="planP"></p></div>
    <div class="plans" id="plans"></div>
    <div class="trial">
      <div><h3 data-t="trialH"></h3><p data-t="trialP"></p></div>
      <a class="btn" href="/entrar" data-t="trialB"></a>
    </div>
  </section>

  <section>
    <div class="sec-head"><p class="eyebrow" data-t="faqE"></p><h2 data-t="faqH"></h2></div>
    <div class="faq" id="faq"></div>
  </section>

  <section id="contato">
    <div class="contact">
      <div>
        <p class="eyebrow" data-t="conE"></p>
        <h2 style="margin-top:10px" data-t="conH"></h2>
        <p class="hint" data-t="conP"></p>
        <a class="number" id="num" target="_blank" rel="noopener" hidden></a>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px;align-self:center">
        <a class="btn" href="/entrar" data-t="trialB"></a>
        <a class="btn ghost" href="/entrar?modo=entrar" data-t="loginL"></a>
      </div>
    </div>
  </section>

  <footer data-t="footer"></footer>
</div>

const DKEYS = Object.keys(DEMOS);

/* ===== Estado ===== */
function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function save(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function guess(){
  const nav = (navigator.language||"pt").toLowerCase();
  let lang = LANGS.find(l => nav.startsWith(l)) || "pt";
  let cur = nav==="pt-br" ? "BRL" : nav==="pt-cv" || nav==="pt" ? "CVE" : nav.startsWith("pt") ? "EUR" : nav==="en-us" ? "USD" : lang==="en" ? "USD" : "EUR";
  return {lang, cur};
}
const g = guess();
const state = {
  lang: LANGS.includes(load("lang")) ? load("lang") : g.lang,
  cur: CURS.includes(load("cur")) ? load("cur") : g.cur,
  demo: "clinica", busy:false
};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function price(tpl){
  return tpl.replace(/\{(\w+)\}/g,(m,k)=>{
    if(k==="ptotal") return fmt(DP.pp[state.cur]+DP.fee[state.cur], state.cur);
    return DP[k] ? fmt(DP[k][state.cur], state.cur) : m;
  });
}

/* ===== Render ===== */
function renderSwitchers(){
  $("langs").innerHTML = LANGS.map(l=>`<button type="button" aria-pressed="${l===state.lang}" data-l="${l}">${l.toUpperCase()}</button>`).join("");
  $("curs").innerHTML = CURS.map(c=>`<button type="button" aria-pressed="${c===state.cur}" data-c="${c}">${c}</button>`).join("");
}
function renderText(){
  const t = T[state.lang];
  document.documentElement.lang = state.lang;
  document.querySelectorAll("[data-t]").forEach(el=>{ const v=t[el.dataset.t]; if(typeof v==="string") el.textContent=v; });
  $("steps").innerHTML = t.steps.map((s,i)=>`<div class="step"><span class="n">${esc(t.stepN)} ${i+1}</span><h3>${esc(s[0])}</h3><p>${esc(s[1])}</p></div>`).join("");
  $("niches").innerHTML = t.niches.map(n=>`<div class="niche"><h3>${esc(n[0])}</h3><p class="pain">${esc(n[1])}</p><p class="gain">${esc(n[2])}</p></div>`).join("");
  $("faq").innerHTML = t.faq.map(f=>`<details><summary>${esc(f[0])}</summary><p>${esc(f[1])}</p></details>`).join("");
  $("tabs").innerHTML = DKEYS.map((k,i)=>`<button type="button" class="tab" role="tab" data-k="${k}" aria-selected="${k===state.demo}">${esc(t.tabs[i])}</button>`).join("");
}
function renderPrices(){
  const t = T[state.lang], P = PRICES[state.cur];
  $("plans").innerHTML = ["ess","pro","com"].map(k=>{
    const [name, feats] = t.plans[k];
    return `<div class="plan${k==="pro"?" best":""}"><p class="tag">${k==="pro"?esc(t.best):"&nbsp;"}</p><h3>${esc(name)}</h3>
      <p class="price"><span>${esc(fmt(P[k][1],state.cur))}</span><small>${esc(t.month)}</small></p>
      <ul><li><strong>${esc(t.perMonth.replace("{n}", LIMITS[k].toLocaleString(LOCALE[state.lang])))}</strong></li>${feats.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>
      <a class="btn${k==="pro"?"":" ghost"}" href="/entrar?plano=${k}">${esc(t.startBtn)}</a></div>`;
  }).join("");
  $("tCur").textContent = state.cur;
  calc();
}
function renderDemo(){
  const d = DEMOS[state.demo], L = d[state.lang], t = T[state.lang];
  state.busy=false;
  $("biz").textContent = d.name; $("av").textContent = d.av;
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected", b.dataset.k===state.demo));
  $("chat").innerHTML="";
  bubble("out", L[0][0], d.time); bubble("in", price(L[0][1]), d.time);
  $("chips").innerHTML = L[1].map((qa,i)=>`<button type="button" class="chip" data-i="${i}">${esc(qa[0])}</button>`).join("");
}
function bubble(side, text, time){
  const el = document.createElement("div"); el.className = "msg "+side;
  if(side==="in"){ const b=document.createElement("span"); b.className="bot"; b.textContent=T[state.lang].bot; el.appendChild(b); }
  el.appendChild(document.createTextNode(text));
  const tm=document.createElement("time"); tm.textContent = time + (side==="in" ? " ✓✓" : ""); el.appendChild(tm);
  $("chat").appendChild(el); $("chat").scrollTop = $("chat").scrollHeight;
}
function ask(i){
  if(state.busy) return; state.busy=true;
  const key=state.demo, lang=state.lang, d=DEMOS[key], qa=d[lang][1][i];
  bubble("out", qa[0], d.time);
  const ty=document.createElement("div"); ty.className="typing"; ty.innerHTML="<i></i><i></i><i></i>";
  $("chat").appendChild(ty); $("chat").scrollTop=$("chat").scrollHeight;
  setTimeout(()=>{ if(key!==state.demo||lang!==state.lang){return;} ty.remove(); bubble("in", price(qa[1]), d.time); state.busy=false; }, 900);
}
function calc(){
  const t=T[state.lang];
  const m=+$("cMsgs").value, p=+$("cPct").value, c=+$("cConv").value;
  let tk=parseFloat($("cTicket").value); if(!(tk>0)) tk=0;
  $("oMsgs").textContent=m; $("oPct").textContent=p+"%"; $("oConv").textContent=c+" / 10";
  const lost = m*30*(p/100)*(c/10)*tk;
  $("cOut").textContent = fmt(lost, state.cur);
  $("cCompare").textContent = t.cCmp.replace("{p}", fmt(PRICES[state.cur].pro[1], state.cur));
}
function updateSend(){
  const a=$("num");
  if(SUPPORT){ a.hidden=false; a.href="https://wa.me/"+SUPPORT; a.textContent="+"+SUPPORT; } else a.hidden=true;
}
function renderAll(){ renderSwitchers(); renderText(); renderPrices(); renderDemo(); updateSend(); }

/* ===== Eventos ===== */
$("langs").addEventListener("click",e=>{ const l=e.target.dataset.l; if(!l) return; state.lang=l; save("lang",l); renderAll(); });
$("curs").addEventListener("click",e=>{ const c=e.target.dataset.c; if(!c) return; state.cur=c; save("cur",c); $("cTicket").value=TICKET[c]; renderSwitchers(); renderPrices(); renderDemo(); updateSend(); });
$("tabs").addEventListener("click",e=>{ const k=e.target.dataset.k; if(!k) return; state.demo=k; renderDemo(); });
$("chips").addEventListener("click",e=>{ const i=e.target.dataset.i; if(i===undefined) return; ask(+i); });
["cMsgs","cPct","cConv","cTicket"].forEach(id=>$(id).addEventListener("input",calc));

$("cTicket").value = TICKET[state.cur];
renderAll();
fetch("/api/public").then(r=>r.json()).then(d=>{
  for(const k of ["ess","pro","com"]){ if(!d.plans?.[k]) continue; LIMITS[k]=d.plans[k].limit; for(const c of CURS) PRICES[c][k]=[0,d.plans[k].price[c]]; }
  SUPPORT = d.support || ""; renderPrices(); updateSend();
}).catch(()=>{});
</script>

<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));}</script>
</body>
